name: Agent Package Safety Checks

on:
  push:
    branches: [feature/agent-package-execution]
  pull_request:
    branches: [dev, feature/agent-core]
    paths:
      - 'src/fileforge/agent/**'
      - 'tests/test_agent_package_*.py'
      - '.github/workflows/agent-package-check.yml'

jobs:
  safety:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]' httpx
      - name: Black formatting diff
        run: >-
          python -m black --diff src/fileforge/agent/package_fs.py
          src/fileforge/agent/package_execution.py tests/test_agent_package_preview.py
      - name: Black
        run: >-
          python -m black --check src/fileforge/agent/package_fs.py
          src/fileforge/agent/package_execution.py tests/test_agent_package_preview.py
      - name: Ruff
        run: >-
          python -m ruff check src/fileforge/agent/package_fs.py
          src/fileforge/agent/package_execution.py tests/test_agent_package_preview.py
      - name: Package regression tests
        run: >-
          python -m pytest -q tests/test_agent_package_preview.py
          tests/test_agent_package_evidence.py tests/test_agent_package_approval.py
