name: Course Workflow Frontend Checks

on:
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/course-workflow.*'
      - 'frontend/index.html'
      - 'frontend/tests/course-workflow.test.cjs'
      - 'frontend/COURSE_WORKFLOW_PREVIEW.md'
      - '.github/workflows/course-workflow-check.yml'
  push:
    branches: [feat/frontend-workflow-ui]
    paths:
      - 'frontend/course-workflow.*'
      - 'frontend/index.html'
      - 'frontend/tests/course-workflow.test.cjs'
      - '.github/workflows/course-workflow-check.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check frontend/course-workflow.js
      - name: Test workflow state helpers
        run: node --test frontend/tests/course-workflow.test.cjs
      - name: Check patch whitespace
        run: git diff --check
